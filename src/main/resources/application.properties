spring.application.name=todo-app

# ---- MySQL connection ----
# Create the database first:  CREATE DATABASE tododb;
# Values can be overridden with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tododb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically (fine for learning and demos).
# In production use Flyway/Liquibase migrations with "validate" instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# Swagger UI: http://localhost:8080/swagger-ui.html
